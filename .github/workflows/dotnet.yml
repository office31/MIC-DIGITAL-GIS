name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Core and ConsoleDemo
        run: dotnet restore software/MICGeoVisionPro.ConsoleDemo/MICGeoVisionPro.ConsoleDemo.csproj
      - name: Build Core and ConsoleDemo
        run: dotnet build software/MICGeoVisionPro.ConsoleDemo/MICGeoVisionPro.ConsoleDemo.csproj --no-restore

  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Desktop
        run: dotnet restore software/MICGeoVisionPro.Desktop/MICGeoVisionPro.Desktop.csproj
      - name: Build Desktop (WPF)
        run: dotnet build software/MICGeoVisionPro.Desktop/MICGeoVisionPro.Desktop.csproj --no-restore
