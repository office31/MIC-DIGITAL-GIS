services:
  - type: web
    name: micgis-api
    env: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: web
    name: micgis-website
    env: static
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_NEON_AUTH_URL
        sync: false
      - key: VITE_API_BASE_URL
        value: https://micgis-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
